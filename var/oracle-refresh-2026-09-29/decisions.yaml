# Oracle refresh, 2026-09-29 (DECISIONS entry 239). Verdicts read from r_<destination>.txt and,
# where a passage only hinted, checked with look.py. `add` puts a page under `answers`; `tool`
# names a questionnaire (rule 11); `correct` changes what a row already said, with the reason.
# Travellers: IN = Indian passport resident in Britain, PH = Filipino resident in the Philippines.

