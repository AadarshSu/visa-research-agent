# --- Every other country, generated rather than curated -------------------------------------
#
# The fourteen above carry hand-written synonyms, demonyms, host labels and mission cities,
# learned from corridors that were actually run. The rest carry only what can be stated without
# guessing: the name, and the country-code top-level domain, which is the ISO alpha-2 lowercased
# for every one of them.
#
# `tlds` is the load-bearing field: it decides whether a domain belongs to the destination's own
# government, which is the rule that replaced human approval. The others are scoring aids the
# model decider does not depend on, so a country here is fully researchable — just with weaker
# heuristic hints than one that has been through a real corridor. Promote a country upward, with
# its demonyms and mission cities, once you have run it and seen what it needs.
#
# Every scalar is quoted. Unquoted, YAML reads Norway's "NO" as the boolean false.

