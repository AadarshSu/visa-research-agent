# Country reference data for discovery.
#
# `host_labels` exists because ISO codes and the labels authorities actually use in hostnames
# disagree: the United Kingdom is GB in ISO 3166-1, but its Japanese mission is uk.emb-japan.go.jp.
# That mismatch must be data, not a special case in code.
#
# `mission_labels` names the post serving a country, in whatever language the authority writes it.
# Brazil publishes every mission under www.gov.br with the post in the path, in Portuguese, so a
# UK applicant is served by `consulado-edimburgo` and `consulado-londres`. It also carries the
# cities, because a post is usually named after its city rather than its country — which is why
# Singapore's `london.mfa.gov.sg` was never recognised as the mission serving a UK applicant.
#
# `demonyms` are the forms that appear in URL paths and link text ("india", "indian").
#
# `tlds` are the country's own top-level domains. A candidate under the destination's own TLD
# almost certainly belongs to that government, whereas "looks governmental" is satisfied by
# any country's .gov — which is how the US embassy in Vietnam outranked Vietnam's own
# immigration department.

schema_version: 1
countries:
  - code: GB
    name: United Kingdom
    synonyms: [united kingdom, uk, great britain, britain, england, scotland, wales]
    demonyms: [british]
    host_labels: [uk, gb, unitedkingdom, greatbritain]
    mission_labels: [uk, gb, london, londres, londra, edinburgh, edimburgo, edimburgh, manchester, glasgow, belfast, cardiff, liverpool]
    tlds: [uk]

