schema_version: 1

# Where evidence comes from.
#   fixtures — saved offline snapshots; never contacts government websites.
#   live     — retrieves the approved official URLs over HTTP, with hash and TTL caching.
# Retrieval is still all-or-nothing, so one unreachable page fails the whole run.
source_mode: live

# How a plan is produced from that evidence.
#   fixture — deterministic offline output; needs no API key and is the tests' baseline.
#   openai  — one bounded structured model call; requires OPENAI_API_KEY and OPENAI_MODEL.
extraction_mode: openai

# Whether a headless browser may read pages that return nothing readable without one.
#   never     — no browser is ever started. A client-rendered page is refused, honestly.
#   on_demand — only after an ordinary fetch came back below the readable-text floor, came back
#               with translation placeholders instead of sentences, or came back as a **challenge**
#               asking whether this client is a browser. Pages that already work are never rendered.
# Rendering widens no trust: every request the page makes is aborted unless its host is already
# approved, and where it lands is re-checked exactly as a redirect is.
# Requires the optional extra: `pip install -e ".[render]"` then `playwright install chromium`.
# Selecting on_demand without it is a loud error, not a silent fallback.
#
# **on_demand since 2026-08-25, and the challenge trigger is why** (DECISIONS entries 41, 73, 75).
# A challenge is a capability test, not a refusal: the authority stated nothing, and answering it by
# running the page's own scripts under our own user agent misrepresents us to nobody. It is worth
# Cyprus and Slovakia outright, whose entire trusted sets answer one. A genuine refusal —
# Greece's Akamai "Access Denied", with no script to run — is still never worked around, and the
# renderer is never pointed at one.
render_mode: on_demand

# Which decider assigns roles at the end of discovery.
#   heuristic — deterministic keyword scoring. Free, offline, explainable, and the regression
#               baseline. It ranks by vocabulary, so it mis-ranks pages that phrase things in a
#               way the lexicon does not carry.
#   model     — one bounded structured call that chooses among pages already fetched from approved
#               domains. It cannot introduce a page, cannot widen trust, and may refuse. Requires
#               OPENAI_API_KEY and OPENAI_MODEL, and costs one call per corridor.
# The heuristic still produces the shortlist either way, and still answers if the call fails.
discovery_decider: model

# Where a destination's sources come from.
#   configured — only the destinations hand-written in destinations.yaml can produce a plan.
#   automatic  — a destination nobody configured is researched at request time: its own
#                government's domains are identified, the corridor is resolved, and the plan is
#                built from what was found. No human approves a domain.
# What replaces that approval is a rule, not trust in search: a domain is used only when it is
# both governmental *and* under the destination country's own top-level domain. That rule
# reproduces every human approval made so far and keeps out commercial insurers, visa agencies,
# and other governments' pages about the destination. Everything downstream is unchanged — public
# suffixes are still refused, redirects re-checked, and a corridor missing a load-bearing role is
# still refused rather than guessed at.
destination_mode: automatic

# Live retrieval freshness window, in hours. Cached pages are reused below the TTL and
# revalidated above it.
source_cache_ttl_hours: 24

# The refusal threshold. Once cached evidence is older than this and cannot be refreshed, the
# source is refused rather than served, so out-of-date guidance can never look current.
source_maximum_stale_hours: 168
