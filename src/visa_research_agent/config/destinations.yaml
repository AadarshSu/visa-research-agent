schema_version: 1
destinations:
  - slug: singapore
    display_name: Singapore
    route_type: national
    implementation_status: available
    application_document_source_ids: [sg_ica_india_visa_details]
    # Sources the plan cannot stand without: the nationality-specific checklist and the page that
    # establishes the visa decision itself. Everything else degrades to a caveat.
    required_source_ids: [sg_ica_india_visa_details, sg_ica_visa_requirement_overview]
    # Approved authority domains. Subdomains are covered, so london.mfa.gov.sg sits under
    # mfa.gov.sg. Never list a bare suffix such as gov.sg.
    trusted_domains: [ica.gov.sg, mfa.gov.sg]
    # VFS is not a government domain and cannot pass domain trust. Its authority comes only from
    # the High Commission page that appoints it.
    appointed_providers:
      - domain: visa.vfsglobal.com
        appointed_by: sg_mfa_london_visa_information
    sources:
      - source_id: sg_ica_visa_requirement_overview
        title: Check if You Need an Entry Visa
        url: https://www.ica.gov.sg/enter-transit-depart/entering-singapore/visa_requirements
        authority: Singapore Immigration & Checkpoints Authority
        kind: immigration_authority
        research_pass: primary
      - source_id: sg_ica_india_visa_details
        title: Visa Requirements for Indian Travel Documents
        url: https://www.ica.gov.sg/enter-transit-depart/entering-singapore/visa_requirements/visa-detail-page/india
        authority: Singapore Immigration & Checkpoints Authority
        kind: immigration_authority
        research_pass: primary
      - source_id: sg_mfa_check_visa
        title: Check if You Need a Singapore Visa
        url: https://www.mfa.gov.sg/visiting-singapore/check-if-you-need-a-singapore-visa/
        authority: Singapore Ministry of Foreign Affairs
        kind: foreign_ministry
        research_pass: primary
      - source_id: sg_mfa_london_visa_information
        title: Visa Information — Singapore High Commission in London
        url: https://london.mfa.gov.sg/visa-information/
        authority: High Commission of the Republic of Singapore in London
        kind: embassy_or_high_commission
        research_pass: primary
      - source_id: sg_ica_entry_requirements
        title: Entering Singapore — General Entry Requirements
        url: https://www.ica.gov.sg/enter-transit-depart/entering-singapore
        authority: Singapore Immigration & Checkpoints Authority
        kind: immigration_authority
        research_pass: primary
      - source_id: sg_vfs_uk_application
        title: Singapore Visa Application in the United Kingdom
        url: https://visa.vfsglobal.com/gbr/en/sgp/
        authority: VFS Global, appointed by the Singapore High Commission in London
        kind: official_application_provider
        research_pass: follow_up

  - slug: japan
    display_name: Japan
    route_type: national
    implementation_status: available
    # The checklist and the eVisa terms are published as PDFs behind small forwarding pages, so
    # this destination only works with PDF retrieval enabled.
    application_document_source_ids: [jp_embassy_uk_tourism_documents]
    required_source_ids: [jp_embassy_uk_tourism_documents, jp_mofa_visa_exemptions]
    # Japan's missions sit on per-country subdomains of emb-japan.go.jp, which the dot-boundary
    # match covers. Never list a bare suffix such as go.jp.
    trusted_domains: [mofa.go.jp, emb-japan.go.jp]
    sources:
      - source_id: jp_mofa_visa_exemptions
        title: Exemption of Visa (Short-Term Stay)
        url: https://www.mofa.go.jp/j_info/visit/visa/short/novisa.html
        authority: Ministry of Foreign Affairs of Japan
        kind: foreign_ministry
        research_pass: primary
      - source_id: jp_mofa_visa_overview
        title: Visa — Application Procedures and Processing
        url: https://www.mofa.go.jp/j_info/visit/visa/index.html
        authority: Ministry of Foreign Affairs of Japan
        kind: foreign_ministry
        research_pass: primary
      - source_id: jp_embassy_uk_temporary_visitor
        title: Temporary Visitor Visa
        url: https://www.uk.emb-japan.go.jp/itpr_en/index_000070.html
        authority: Embassy of Japan in the United Kingdom
        kind: embassy_or_high_commission
        research_pass: primary
      - source_id: jp_embassy_uk_tourism_documents
        title: Checklist for a Temporary Visitor Visa (Tourism)
        url: https://www.uk.emb-japan.go.jp/itpr_en/sightseeing.html
        authority: Embassy of Japan in the United Kingdom
        kind: embassy_or_high_commission
        research_pass: primary
      - source_id: jp_embassy_uk_visa_general
        title: Visa — General Information and Appointments
        url: https://www.uk.emb-japan.go.jp/itpr_en/index_000025.html
        authority: Embassy of Japan in the United Kingdom
        kind: embassy_or_high_commission
        research_pass: primary
      - source_id: jp_embassy_uk_evisa
        title: JAPAN eVISA — Availability for Tourism
        url: https://www.uk.emb-japan.go.jp/itpr_en/eVISA_System.html
        authority: Embassy of Japan in the United Kingdom
        kind: embassy_or_high_commission
        research_pass: primary
      - source_id: jp_embassy_uk_visa_fees
        title: Visa Fees
        url: https://www.uk.emb-japan.go.jp/itpr_en/index_000075.html
        authority: Embassy of Japan in the United Kingdom
        kind: embassy_or_high_commission
        research_pass: primary

  - slug: united-states
    display_name: United States
    route_type: national
    implementation_status: planned
    sources: []

  - slug: france
    display_name: France
    route_type: schengen_member
    schengen_member: France
    implementation_status: planned
    sources: []
