# What a selector should have chosen to read, for ten corridors, named by hand.
#
# **Neither selector helped make this file, and that is its whole point.** Every measurement in
# DECISIONS entries 84 to 86 was graded against a set the two arms built between them: a page filled
# a role only if some arm had read it, so a page neither read could never enter the oracle. This one
# was built from each corridor's *whole* contention set — every candidate that scored above zero,
# 77 to 552 of them — read out of the page-text index, which is filled by the corpus crawl and the
# retrieval cache and is indifferent to what either selector picked.
#
# What "answers a role" means here is what `prompts/adjudicate_roles.txt` says it means, applied by
# hand: rule 4 for a checklist that names documents rather than mentioning them, rule 5 for the post
# serving the traveller's residence, rule 6 for the purpose and the passport. Where the two rules
# disagree with what looks like the obvious page, `excluded:` says so and why.
#
# It records what could NOT be established as carefully as what could:
#
#   answers       role -> the pages that answer it, with `seen:` and the sentence that decided it
#   tools         role -> an official questionnaire that works the answer out, per entries 59-60.
#                 Naming one never fills a role; it is graded on its own line
#   unanswered    role -> why nothing in the contention set answers it
#   unverifiable  candidates that plausibly answer a role and hold no stored text, so nobody could
#                 judge them. Neither credited nor dismissed
#   excluded      a page that looks like an answer and is not, with the rule that excludes it
#   joint         the 29 pages entries 85 and 86 graded against, kept so the bias they acknowledged
#                 stays measurable from committed data rather than from a scratchpad
#
# `seen:` is how the page was read. `text` is its own stored body. `title_only` is its address and
# label alone, where the index holds no body and the address is unambiguous. `mirror` is the same
# document read at a second address the index does hold — the United States publishes its whole
# /content/travel/en/ tree under several subdomains.
#
# The bound on all of it: a role can only be answered by a page someone could read. Coverage runs
# from 21 of 206 candidates in France, where the portal answers a Cloudflare challenge, to 269 of
# 329 in the United Kingdom. `text_held` on each corridor says which.
#
# Ten corridors, one nationality and one residence: an Indian passport, applying from Britain, for
# tourism. Built 2026-08-27, DECISIONS entry 87.

