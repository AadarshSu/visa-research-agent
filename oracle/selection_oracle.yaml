  # apart, and every finding in it that turned on residence — the UAE's visa on arrival, the UK fee
  # table keyed on the application country, the Netherlands' UK checklist — would be invisible in a
  # row where they coincide. `PH/PH` is also the profile entry 88's rebuild was proved on, so it is
  # the one place a corpus change can be seen at all.
