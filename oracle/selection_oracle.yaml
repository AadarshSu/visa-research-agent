  # read out of a live run, because nobody has run these corridors. The sets come out close to the
  # recorded ones above (365 against 417 for the UAE, 539 against 552 for Canada) and they are not
  # the same set: a role whose only answer live search would have surfaced cannot be curated from
  # here. DECISIONS entry 91.
